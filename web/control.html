<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoreboard - Painel de controle</title>
<style>
  body {
    margin: 0;
    padding: 20px;
    font-family: "Helvetica Neue", Arial, sans-serif;
    background: #111827;
    color: #f3f4f6;
  }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .teams { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .team {
    background: #1f2937;
    border-radius: 10px;
    padding: 16px;
  }
  .team-score {
    font-size: 48px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    margin: 8px 0;
  }
  .summary { font-size: 14px; color: #9ca3af; }
  button {
    font: inherit;
    border: 0;
    border-radius: 8px;
    padding: 12px 16px;
    margin: 4px 4px 4px 0;
    background: #374151;
    color: #f3f4f6;
    cursor: pointer;
  }
  button:hover { background: #4b5563; }
  button.primary { background: #65a30d; color: #fff; font-size: 18px; width: 100%; }
  button.danger { background: #7f1d1d; }
  .adjust { margin-top: 8px; border-top: 1px solid #374151; padding-top: 8px; }
  .adjust button { padding: 8px 12px; font-size: 14px; }
  .actions { margin-top: 16px; }
  .names { margin-top: 20px; background: #1f2937; border-radius: 10px; padding: 16px; }
  .names label { display: block; font-size: 13px; color: #9ca3af; margin-top: 10px; }
  .names input {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border-radius: 6px;
    border: 1px solid #374151;
    background: #111827;
    color: #f3f4f6;
  }
  .error { color: #f87171; margin-top: 12px; min-height: 1em; }
  button:disabled { opacity: 0.5; cursor: default; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .topbar a { color: #a3e635; font-size: 14px; }
  .route { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #9ca3af; margin: 0 0 16px; }
  .route code { color: #d1d5db; }
  .route button { padding: 4px 10px; font-size: 13px; margin: 0; }
  .banner { display: none; background: #7f1d1d; border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
  .banner.visible { display: block; }
</style>
</head>
<body>
<div class="topbar">
  <a href="/">← Partidas</a>
  <button class="danger" id="finish-button" onclick="finishMatch()">Finalizar partida</button>
</div>
<h1 id="title">Placar ao vivo</h1>
<div class="route">
  Overlay: <code id="overlay-url"></code>
  <button onclick="copy('overlay-url', this)">Copiar</button>
</div>
<div class="banner" id="finished-banner">Partida finalizada. O placar não pode mais ser alterado.</div>

<div id="panel">
<div class="teams">
  <div class="team">
    <div class="summary" id="summary-0"></div>
    <div class="team-score" id="points-0">0</div>
    <button class="primary" onclick="point(0)">+ Ponto</button>
    <button onclick="switchServe()">Trocar saque</button>
    <div class="adjust">
      <button onclick="teamAction(base + '/games/add', 0)">+ Game</button>
      <button onclick="teamAction(base + '/games/remove', 0)">− Game</button>
      <button onclick="teamAction(base + '/sets/add', 0)">+ Set</button>
      <button onclick="teamAction(base + '/sets/remove', 0)">− Set</button>
    </div>
  </div>
  <div class="team">
    <div class="summary" id="summary-1"></div>
    <div class="team-score" id="points-1">0</div>
    <button class="primary" onclick="point(1)">+ Ponto</button>
    <button onclick="switchServe()">Trocar saque</button>
    <div class="adjust">
      <button onclick="teamAction(base + '/games/add', 1)">+ Game</button>
      <button onclick="teamAction(base + '/games/remove', 1)">− Game</button>
      <button onclick="teamAction(base + '/sets/add', 1)">+ Set</button>
      <button onclick="teamAction(base + '/sets/remove', 1)">− Set</button>
    </div>
  </div>
</div>

<div class="actions">
  <button class="danger" onclick="undo()">Desfazer último ponto</button>
  <button onclick="reset()">Novo jogo (melhor de <span id="best-of">3</span>)</button>
</div>

<div class="names">
  <strong>Atletas</strong>
  <label>Time 1 (separe os nomes com vírgula)</label>
  <input id="team-input-0" placeholder="Erico, João">
  <label>Time 2 (separe os nomes com vírgula)</label>
  <input id="team-input-1" placeholder="Pedro, Lucas">
  <button onclick="saveTeams()" style="margin-top:12px">Salvar nomes</button>
</div>
</div>

<div class="error" id="error"></div>

<script>
  // The game id is the second segment of the path: /scoreboard/<id>/control
  var gameId = location.pathname.split("/")[2];
  var base = "/api/scoreboard/" + gameId;
  var bestOf = 3;

  function loadGame() {
    fetch("/api/games/" + gameId).then(function (r) {
      if (!r.ok) throw new Error("Partida não encontrada");
      return r.json();
    }).then(function (game) {
      document.getElementById("title").textContent = game.name;
      document.title = game.name + " - Painel de controle";
      document.getElementById("overlay-url").textContent =
        location.origin + "/scoreboard/" + gameId + "/overlay";
      lockPanel(game.finishedAt !== null);
    }).catch(function (e) {
      document.getElementById("error").textContent = e.message;
    });
  }

  // Finished matches keep showing the overlay, but no change is allowed.
  function lockPanel(finished) {
    document.querySelectorAll("#panel button").forEach(function (b) { b.disabled = finished; });
    document.getElementById("finish-button").disabled = finished;
    document.getElementById("finished-banner").classList.toggle("visible", finished);
  }

  function finishMatch() {
    if (!confirm("Finalizar esta partida? O placar não poderá mais ser alterado.")) return;
    fetch("/api/games/" + gameId + "/finish", { method: "POST" }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error(t.trim()); });
      lockPanel(true);
    }).catch(function (e) {
      document.getElementById("error").textContent = e.message;
    });
  }

  function copy(id, button) {
    navigator.clipboard.writeText(document.getElementById(id).textContent).then(function () {
      button.textContent = "Copiado";
      setTimeout(function () { button.textContent = "Copiar"; }, 1500);
    });
  }

  function send(path, body) {
    return fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : null
    }).then(function (r) {
      if (!r.ok) return r.text().then(function (t) { throw new Error(t.trim()); });
      return r.json();
    }).then(function (view) {
      document.getElementById("error").textContent = "";
      render(view);
    }).catch(function (e) {
      document.getElementById("error").textContent = e.message;
    });
  }

  function point(team) { send(base + "/point", { team: team }); }
  function teamAction(path, team) { send(path, { team: team }); }
  function switchServe() { send(base + "/serve", {}); }
  function undo() { send(base + "/undo", {}); }
  function reset() {
    if (confirm("Zerar o placar atual? Os nomes serão mantidos.")) {
      send(base + "/reset", { bestOf: bestOf });
    }
  }

  function saveTeams() {
    var teams = [0, 1].map(function (i) {
      var text = document.getElementById("team-input-" + i).value;
      var players = text.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
      return { players: players };
    });
    send(base + "/teams", { teams: teams });
  }

  function render(view) {
    bestOf = view.bestOf;
    document.getElementById("best-of").textContent = view.bestOf;

    [0, 1].forEach(function (i) {
      var marker = view.serving === i && view.winner < 0 ? " · sacando" : "";
      document.getElementById("summary-" + i).textContent =
        view.teams[i].players.join(" / ") + marker + " · sets " + view.setsWon[i] +
        " · games " + view.games[i];
      document.getElementById("points-" + i).textContent = view.points[i];

      var input = document.getElementById("team-input-" + i);
      if (document.activeElement !== input) {
        input.value = view.teams[i].players.join(", ");
      }
    });

    if (view.winner >= 0) {
      document.getElementById("error").textContent = "Partida encerrada. Vencedor: " + view.teams[view.winner].players.join(" / ");
    }
  }

  // Syncs with the server and updates when another panel changes the score.
  var events = new EventSource(base + "/events");
  events.onmessage = function (e) { render(JSON.parse(e.data)); };

  loadGame();
</script>
</body>
</html>
