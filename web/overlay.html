<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Scoreboard - Overlay</title>
<style>
  /* Transparent background: OBS draws the video underneath. */
  html, body {
    margin: 0;
    background: transparent;
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  .scoreboard {
    position: absolute;
    left: 40px;
    top: 40px;
    width: 372px;
    background: rgba(12, 18, 32, 0.88);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
  }
  .row {
    display: grid;
    grid-template-columns: 1fr 52px 52px 64px;
    align-items: center;
    height: 50px;
    padding: 0 12px;
  }
  .row + .row { border-top: 1px solid rgba(255, 255, 255, 0.08); }
  .name {
    font-size: 18px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Tennis ball (resource/icons/tennis.svg) marks the team serving. */
  .serving::before {
    content: "";
    display: inline-block;
    width: 16px;
    height: 16px;
    margin-right: 6px;
    vertical-align: middle;
    background: url("/icons/tennis.svg") center / contain no-repeat;
  }
  .sets, .games, .points {
    text-align: center;
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .sets { color: #d6ff3d; }
  .points { background: rgba(255, 255, 255, 0.06); height: 100%; line-height: 50px; }
  .history {
    display: flex;
    gap: 10px;
    padding: 4px 12px;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    background: rgba(255, 255, 255, 0.03);
  }
  .hidden { display: none; }
  /* One-set matches have no sets to show: drop the sets column and the sets history. */
  .single-set .sets, .single-set .history { display: none; }
  .single-set .row { grid-template-columns: 1fr 52px 64px; }
</style>
</head>
<body>
<div class="scoreboard" id="scoreboard">
  <div class="row" id="row-0">
    <div class="name" id="name-0"></div>
    <div class="sets" id="sets-0"></div>
    <div class="games" id="games-0"></div>
    <div class="points" id="points-0"></div>
  </div>
  <div class="row" id="row-1">
    <div class="name" id="name-1"></div>
    <div class="sets" id="sets-1"></div>
    <div class="games" id="games-1"></div>
    <div class="points" id="points-1"></div>
  </div>
  <div class="history" id="history"></div>
</div>

<script>
  // The game id is the second segment of the path: /scoreboard/<id>/overlay
  var base = "/api/scoreboard/" + location.pathname.split("/")[2];

  function render(view) {
    document.getElementById("scoreboard").classList.toggle("single-set", view.bestOf === 1);

    [0, 1].forEach(function (i) {
      var name = document.getElementById("name-" + i);
      name.textContent = view.teams[i].players.join(" / ");
      name.classList.toggle("serving", view.serving === i && view.winner < 0);

      document.getElementById("sets-" + i).textContent = view.setsWon[i];
      document.getElementById("games-" + i).textContent = view.games[i];
      document.getElementById("points-" + i).textContent = view.points[i];
    });

    var history = document.getElementById("history");
    history.innerHTML = "";
    view.sets.forEach(function (set) {
      var span = document.createElement("span");
      span.textContent = set[0] + "-" + set[1];
      history.appendChild(span);
    });
    history.classList.toggle("hidden", view.sets.length === 0);
  }

  // Initial state and real-time updates via SSE.
  // EventSource reconnects on its own if the server goes down.
  var events = new EventSource(base + "/events");
  events.onmessage = function (e) { render(JSON.parse(e.data)); };
</script>
</body>
</html>
